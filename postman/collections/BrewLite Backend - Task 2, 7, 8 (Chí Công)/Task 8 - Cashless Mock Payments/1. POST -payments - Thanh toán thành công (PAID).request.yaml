$kind: http-request
name: 1. POST /payments - Thanh toán thành công (PAID)
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: idem-pay-001
body:
  type: text
  content: |-
    {
      "orderId": "{{orderId}}",
      "method": "E_WALLET",
      "idempotencyKey": "idem-pay-001"
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 1000
