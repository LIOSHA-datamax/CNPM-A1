$kind: http-request
name: 2. POST /payments - Thanh toán lỗi (PAYMENT_FAILED)
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: idem-pay-fail-001
body:
  type: text
  content: |-
    {
      "orderId": "{{orderId}}",
      "method": "BANK_CARD",
      "idempotencyKey": "idem-pay-fail-001",
      "simulateFailure": true
    }
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
order: 2000
